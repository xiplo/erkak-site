# erkak.com · экосистема ERKAK: заявки идут в server/leads.mjs (порт 8796), статика — из /var/www/erkak.com (wellness/public).
# Подключается в server-блоки /etc/nginx/sites-available/erkak.com.conf строкой
#   include snippets/erkak-wellness.conf;
# deploy.sh проверяет nginx -t и откатывает сниппет, если он конфликтует с конфигом сервера.

# Заявки. Точное совпадение location = /api/lead приоритетнее префикса /api/ магазина.
location = /api/lead {
    limit_except POST { deny all; }
    proxy_pass http://127.0.0.1:8796;
    proxy_set_header X-Forwarded-For $remote_addr;
    client_max_body_size 16k;
}

# Оплата предоплаты (Stripe Checkout) и вебхук Stripe
location = /api/checkout {
    limit_except POST { deny all; }
    proxy_pass http://127.0.0.1:8796;
    proxy_set_header X-Forwarded-For $remote_addr;
    client_max_body_size 16k;
}
location = /api/stripe {
    limit_except POST { deny all; }
    proxy_pass http://127.0.0.1:8796;
    client_max_body_size 256k;
}

# Ассеты с хешем в имени (CSS, JS, спрайт, шрифты, данные языков) — кэш на год
location ^~ /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header Access-Control-Allow-Origin "*";
    access_log off;
    gzip on;
    gzip_vary on;
    gzip_types text/css application/javascript text/javascript image/svg+xml application/json;
    try_files $uri =404;
}

# Страницы без хеша: браузер перепроверяет, CDN может кэшировать ненадолго
location ~* \.html$ {
    add_header Cache-Control "public, max-age=0, must-revalidate";
    add_header X-Content-Type-Options "nosniff";
    add_header Referrer-Policy "strict-origin-when-cross-origin";
    gzip on;
    gzip_vary on;
}

# Корень / отдаёт выбор языка, 404 — многоязычная страница
error_page 404 /404.html;
