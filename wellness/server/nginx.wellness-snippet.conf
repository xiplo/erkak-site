# erkak.com · экосистема ERKAK: заявки идут в server/leads.mjs (порт 8796).
# Подключается в server-блоки /etc/nginx/sites-available/erkak.com.conf строкой
#   include snippets/erkak-wellness.conf;
# Точное совпадение location = /api/lead приоритетнее префикса /api/ магазина.
location = /api/lead {
    limit_except POST { deny all; }
    proxy_pass http://127.0.0.1:8796;
    proxy_set_header X-Forwarded-For $remote_addr;
    client_max_body_size 16k;
}
