# erkak.com/shop · магазин ERKAK в подпапке основного сайта.
# Статика — /var/www/erkak.com-shop, API — server.mjs на 127.0.0.1:8795 (адреса /shop/api/… → /api/…).
# Подключается в server-блок /etc/nginx/sites-available/erkak.com.conf строкой
#   include snippets/erkak-shop.conf;
# Ставит и проверяет его `deploy.sh shop`: при ошибке nginx -t возвращает прежний конфиг.
#
# Везде «^~»: у основного сайта есть правило по регулярному выражению для *.html, и без «^~»
# оно перехватило бы страницы магазина и искало бы их в папке основного сайта.

location = /shop { return 301 /shop/; }

location ^~ /shop/api/ {
    proxy_pass http://127.0.0.1:8795/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
    client_max_body_size 64k;
}

location ^~ /shop/img/ {
    alias /var/www/erkak.com-shop/img/;
    expires 7d;
}

location ^~ /shop/ {
    alias /var/www/erkak.com-shop/;
    index index.html;
    error_page 404 /shop/404.html;
    gzip on;
    gzip_vary on;
    gzip_types text/css application/javascript image/svg+xml application/json;
}
