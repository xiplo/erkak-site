server {
    listen 80;
    listen [::]:80;
    server_name erkak.com www.erkak.com;
    root /var/www/erkak.com;
    index index.html;
    error_page 404 /404.html;

    gzip on;
    gzip_types text/html text/css application/javascript image/svg+xml application/json;
    add_header X-Content-Type-Options nosniff;
    add_header Referrer-Policy strict-origin-when-cross-origin;

    location /api/ {
        proxy_pass http://127.0.0.1:8795;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        client_max_body_size 64k;
    }
    location /img/ { expires 7d; add_header Cache-Control "public, immutable"; }
    location /assets/ { expires 1h; }
    location / { try_files $uri $uri/ $uri.html =404; }
}
