# ERKAK · выкладка экосистемы (wellness/) на erkak.com с машин GitHub.
# Секреты — в GitHub: Settings → Secrets and variables → Actions → New repository secret.
#   VPS_SSH_KEY            приватный SSH-ключ сервера (обязательно для выкладки; без него — только сборка и проверки)
#   VPS_HOST, VPS_USER     по умолчанию 62.238.59.42 и root
#   TELEGRAM_BOT_TOKEN, LEADS_TG_CHAT          заявки в Telegram-группу
#   STRIPE_SECRET_KEY, STRIPE_WEBHOOK_SECRET   предоплата картой
# Запуск: при каждом пуше в эту ветку с изменениями в wellness/ или вручную (Actions → Deploy ERKAK → Run workflow).
name: Deploy ERKAK
on:
  workflow_dispatch:
  push:
    branches: [claude/thailand-fishing-tours-vjkxkt]
    paths: ['wellness/**', 'deploy.sh', '.github/workflows/deploy-wellness.yml']
concurrency:
  group: deploy-wellness
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Секреты на месте?
        id: s
        env:
          KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::warning::Нет секрета VPS_SSH_KEY — только сборка и проверки, без выкладки"
            echo "ok=0" >> "$GITHUB_OUTPUT"
          else
            echo "ok=1" >> "$GITHUB_OUTPUT"
          fi
      - name: Сборка и проверки
        working-directory: wellness
        run: STRICT=1 node build.mjs && node tools/check-i18n.mjs && node tools/check.mjs
      - name: SSH-ключ
        if: steps.s.outputs.ok == '1'
        env:
          KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/erkak_key && chmod 600 ~/.ssh/erkak_key
          printf 'Host *\n  IdentityFile ~/.ssh/erkak_key\n  IdentitiesOnly yes\n  ServerAliveInterval 30\n' > ~/.ssh/config
      - name: Выкладка на erkak.com
        if: steps.s.outputs.ok == '1'
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          LEADS_TG_CHAT: ${{ secrets.LEADS_TG_CHAT }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
        run: ./deploy.sh wellness
